name: Verify research release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test source integrity and historical regression
        run: python -m pytest -q -m 'not slow'
      - name: Reproduce frozen six-model validation
        run: python scripts/reproduce.py
      - name: Reproduce expanded eight-model release
        run: python scripts/reproduce_v51.py
